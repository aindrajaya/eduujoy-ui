name: Security scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a full commit SHA (v7.0.1) rather than a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Uses the runner's preinstalled Node. No install, no build,
      # no repository code is executed — only the standalone scanner.
      - name: Scan tracked files
        run: node scripts/security-scan.mjs

      # pnpm audit reads pnpm-lock.yaml only; nothing is installed or run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - name: Audit dependencies
        run: pnpm audit --audit-level high
